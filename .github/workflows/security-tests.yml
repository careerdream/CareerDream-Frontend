name: 🔐 Security Tests (CI)

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  schedule:
    # Run automatically every Monday at 3:00 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Rate Limiting & RBAC Tests
  # ─────────────────────────────────────────────────────────────────
  security-tests:
    name: Rate Limiting & Access Control Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: careerdream_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install backend dependencies
        run: npm ci
        working-directory: ./server

      - name: 🗄️ Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: ./server
        env:
          DATABASE_URL: mysql://root:testpassword@localhost:3306/careerdream_test
          JWT_SECRET: ci-test-jwt-secret-not-for-production

      - name: 🚀 Start backend server
        run: |
          node server.js &
          echo "Server PID: $!"
          sleep 5  # Wait for server to be ready
        working-directory: ./server
        env:
          DATABASE_URL: mysql://root:testpassword@localhost:3306/careerdream_test
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          PORT: 5000

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: security_tests/requirements.txt

      - name: 📦 Install Python security test dependencies
        run: pip install -r requirements.txt
        working-directory: ./security_tests

      - name: 🚦 Run Rate Limiting Tests
        run: python brute_force_test.py
        working-directory: ./security_tests

      - name: 🔒 Run RBAC & Access Control Tests
        run: python rbac_test.py
        working-directory: ./security_tests

      - name: ✅ Verify health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check failed! Status: $STATUS"
            exit 1
          fi
          echo "✅ Health check passed."

  # ─────────────────────────────────────────────────────────────────
  # Job 2: SSL Validation (Production only)
  # ─────────────────────────────────────────────────────────────────
  ssl-validation:
    name: SSL/TLS Certificate Validation
    runs-on: ubuntu-latest
    # Only run on main branch pushes (checks production/staging cert)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests pyopenssl
        working-directory: ./security_tests

      - name: 🔐 Run SSL/TLS Validation
        run: python ssl_test.py
        working-directory: ./security_tests

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Light Load Test (Smoke Test — fast, always runs)
  # ─────────────────────────────────────────────────────────────────
  load-smoke-test:
    name: Load Smoke Test (50 users, 30s)
    runs-on: ubuntu-latest
    needs: security-tests  # Only run after main tests pass

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install backend dependencies
        run: npm ci
        working-directory: ./server

      - name: 🚀 Start backend server
        run: |
          node server.js &
          sleep 5
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'mysql://root:testpassword@localhost:3306/careerdream_test' }}
          JWT_SECRET: ci-test-jwt-secret
          PORT: 5000

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Locust
        run: pip install locust

      - name: ⚡ Run Locust smoke test (50 users, 30 seconds)
        run: |
          locust -f locustfile.py \
            --host=http://localhost:5000 \
            --headless \
            --users=50 \
            --spawn-rate=10 \
            --run-time=30s \
            --html=locust_report.html \
            --only-summary 2>&1
        working-directory: ./security_tests

      - name: 📊 Upload Locust Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locust-smoke-test-report
          path: security_tests/locust_report.html
          retention-days: 14
